# Alembic configuration for the local SQLite store.
#
# The CLI does not read this file: `food_cli.core.migrations` builds its own
# config so the database URL can follow FOOD_CLI_DB. This exists so the usual
# `alembic ...` commands work for inspection and for authoring new revisions.
[alembic]
script_location = food_cli/migrations
sqlalchemy.url = sqlite:///%(HOME)s/.food-cli/food.db

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
