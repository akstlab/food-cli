[project]
name = "food-cli"
version = "0.2.0"
description = "Order food and groceries from the command line, over the providers' official MCP servers (Swiggy, Zepto). Built for voice/agent-driven ordering."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.16.0",
    "httpx>=0.28.1",
    "mcp>=2.0.0",
    "rich>=15.0.0",
    "segno>=1.6.6",
    "sqlalchemy>=2.0.36",
    "typer>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/akstlab/food-cli"
Repository = "https://github.com/akstlab/food-cli"
Issues = "https://github.com/akstlab/food-cli/issues"

[project.scripts]
food = "food_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["food_cli"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
markers = [
    "real_fetch: test drives security.safe_get directly and opts out of the stub",
]
